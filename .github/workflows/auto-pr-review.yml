name: "Automatic PR Review"

on:
    pull_request_target:
        types:
            - opened
            - synchronize
            - reopened

concurrency:
    group: "${{ github.workflow }}-${{ github.event.pull_request.number }}"
    cancel-in-progress: true

defaults:
    run:
        shell: "bash"

jobs:
    auto-review:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: "read"
            issues: "write"
            pull-requests: "write"
        steps:
            - name: "Checkout default branch for action"
              uses: "actions/checkout@v4"
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  path: "base"

            - name: "Create pr working directory"
              run: mkdir -p ${{ github.workspace }}/pr

            - name: "Set up Node.js"
              uses: "actions/setup-node@v4"
              with:
                  node-version: "${{ vars.NODE_VERSION || '22' }}"

            - name: "Log runner Node version"
              run: |
                  echo "node: $(node --version 2>/dev/null || echo 'not found')"
                  echo "node path: $(command -v node 2>/dev/null || echo 'not found')"

            - name: "Download and install GitHub MCP server"
              working-directory: ${{ github.workspace }}/pr
              run: |
                  curl \
                    --retry 3 \
                    --retry-max-time 60 \
                    -L -s --fail \
                    -o github-mcp-server.tar.gz https://github.com/github/github-mcp-server/releases/download/v0.20.1/github-mcp-server_Linux_x86_64.tar.gz
                  tar -xzf github-mcp-server.tar.gz
                  chmod +x ./github-mcp-server
                  rm github-mcp-server.tar.gz
            - name: "Copy bob-action and commands from base branch"
              run: |
                  mkdir -p ${{ github.workspace }}/.github/actions/bob-action
                  cp -r ${{ github.workspace }}/base/.github/actions/bob-action/. \
                        ${{ github.workspace }}/.github/actions/bob-action/
                  mkdir -p ${{ github.workspace }}/.github/commands
                  cp -r ${{ github.workspace }}/base/.github/commands/. \
                        ${{ github.workspace }}/.github/commands/
            - name: "Run automatic pull request review"
              uses: "./.github/actions/bob-action"
              id: "bobshell_pr_review"
              env:
                  GITHUB_TOKEN:
                      "${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN
                      }}"
                  ISSUE_TITLE: "${{ github.event.pull_request.title }}"
                  ISSUE_BODY: "${{ github.event.pull_request.body }}"
                  PULL_REQUEST_NUMBER: "${{ github.event.pull_request.number }}"
                  REPOSITORY: "${{ github.repository }}"
                  WORKSPACE_PATH: "${{ github.workspace }}/pr"
              with:
                  max_coins: 3
                  bobshell_api_key: "${{ secrets.BOBSHELL_API_KEY }}"
                  bobshell_version: "${{ vars.BOBSHELL_VERSION || 'latest' }}"
                  bobshell_debug:
                      "${{ fromJSON(vars.DEBUG || vars.ACTIONS_STEP_DEBUG ||
                      false) }}"
                  settings: |-
                      {
                        "coreTools": [
                          "attempt_completion"
                        ]
                      }
                  mcp: |-
                      {
                        "mcpServers": {
                          "github": {
                            "command": "${{ github.workspace }}/pr/github-mcp-server",
                            "args": ["stdio"],
                            "includeTools": [
                              "add_comment_to_pending_review",
                              "pull_request_read",
                              "pull_request_review_write",
                              "issue_read"
                            ],
                            "env": {
                              "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}",
                              "GITHUB_HOST": "https://github.com"
                            }
                          },
                          "aid": {
                            "command": "npx",
                            "args": ["-y", "@janreges/ai-distiller-mcp"],
                            "includeTools": [
                              "distill_file",
                              "distill_directory"
                            ]
                          }
                        }
                      }
                  prompt: "/bob-review"

            - name: "Post review cost"
              if: hashFiles('pr/session-summary.json') != ''
              working-directory: pr
              env:
                  COMMENT_TOKEN:
                      "${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN
                      }}"
                  REPOSITORY: "${{ github.repository }}"
                  PULL_REQUEST_NUMBER: "${{ github.event.pull_request.number }}"
                  ACTOR: "${{ github.actor }}"
              run: |
                  cost=$(jq -r '.sessionMetrics.sessionCost' session-summary.json)

                  curl \
                  --retry 3 \
                  --retry-max-time 60 \
                  -L -s --fail \
                  -X POST \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer ${COMMENT_TOKEN}" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/${REPOSITORY}/issues/${PULL_REQUEST_NUMBER}/comments" \
                  -d "{\"body\":\"🤖 Hey @${ACTOR}, the cost of our automatic review was **${cost}** Bob coins.\"}"

# Made with Bob
